[project]
name = "mugiurushi-ai"
version = "0.1.0"
description = "麦漆（mugiurushi）のAIエージェント：医療情報系ガイドラインとの照合と、対話による試験範囲の決定"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=3.46",
    "fastapi>=0.162",
    "uvicorn>=0.54",
    "pydantic>=2.14",
    "pypdf[crypto]>=6.21",
    "httpx>=0.28",
]

[project.scripts]
mugiurushi-ai = "mugiurushi_ai.cli:main"

[dependency-groups]
dev = ["pytest>=9.2", "ruff>=0.17"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mugiurushi_ai"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# 行の長さは整形（ruff format）に任せる。AIへの指示文は折り返さずに読める形を保つ。
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]

[tool.pytest.ini_options]
testpaths = ["tests"]
